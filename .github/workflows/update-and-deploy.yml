name: Update SignalDeck v2 Free and deploy Pages

on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: '7,37 * * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Cache local ML models
        uses: actions/cache@v4
        with:
          path: |
            .cache/fastembed
            ~/.local/share/argos-translate
            ~/.local/cache/argos-translate
            ~/.config/argos-translate
          key: signaldeck-models-v2-fastembed-e5-argos-en-ja

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch intelligence
        env:
          RSSHUB_BASE_URL: ${{ vars.RSSHUB_BASE_URL }}
        run: python scripts/fetch_news.py

      - name: Semantic clustering
        run: python scripts/semantic_cluster.py

      - name: Free Japanese enrichment
        run: python scripts/free_enrich.py

      - name: Fetch market data
        env:
          ALPHAVANTAGE_API_KEY: ${{ secrets.ALPHAVANTAGE_API_KEY }}
        run: python scripts/fetch_stocks.py

      - name: Validate generated data
        run: python scripts/validate.py

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: '.'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
